            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .nav {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 5px;
        }

        .nav-item {
            padding: 10px 0;
            color: #666;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .nav-item.active {
            color: #e91e8c;
            border-bottom-color: #e91e8c;
        }

        .nav-item:hover {
            color: #e91e8c;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #e91e8c 0%, #667eea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .controls {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .control-group label::before {
            content: '🎨';
            font-size: 16px;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 150px;
        }

        select:hover {
            border-color: #e91e8c;
        }

        select:focus {
            outline: none;
            border-color: #e91e8c;
        }

        .button-group {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-generate {
            background: #e91e8c;
            color: white;
        }

        .btn-generate:hover {
            background: #d01a7a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 30, 140, 0.3);
        }

        .btn-save {
            background: white;
            border: 2px solid #e0e0e0;
            color: #666;
        }

        .btn-save:hover {
            border-color: #e91e8c;
            color: #e91e8c;
        }

        .palette-display {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 30px;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
        }

        .palette {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            flex: 1;
        }

        .color-swatch {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 80px;
            border-radius: 12px;
            cursor: grab;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .color-swatch:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .color-swatch.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .color-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .color-code {
            background: rgba(255, 255, 255, 0.95);
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 16px;
            color: #333;
            display: inline-block;
        }

        .lock-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .lock-btn:hover {
            background: white;
            transform: scale(1.1);
        }

        .lock-btn.locked {
            background: #e91e8c;
        }

        .lock-btn svg {
            width: 18px;
            height: 18px;
            fill: #666;
        }

        .lock-btn.locked svg {
            fill: white;
        }

        .color-name {
            font-size: 14px;
            color: rgba(0, 0, 0, 0.6);
            font-weight: 500;
        }
        
        #colorNames, #imageColorNames {
            display: none !important;
        }

        .instructions {
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 20px;
        }

        .instructions span {
            margin: 0 10px;
        }

        .image-upload {
            text-align: center;
        }

        .upload-area {
            border: 3px dashed #e0e0e0;
            border-radius: 12px;
            padding: 60px 40px;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: #e91e8c;
            background: #fdf7fb;
        }

        .upload-area.dragover {
            border-color: #e91e8c;
            background: #fdf7fb;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 18px;
            color: #666;
            margin-bottom: 10px;
        }

        .upload-subtext {
            font-size: 14px;
            color: #999;
        }

        #imageInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-bottom: 30px;
        }

        .preview-container.active {
            display: block;
        }

        .image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            margin: 0 auto 20px;
            display: block;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            width: 48px;
            height: 24px;
            background: #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .switch.active {
            background: #e91e8c;
        }

        .switch::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: all 0.3s;
        }

        .switch.active::after {
            left: 27px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }
            
            .color-swatch {
                height: 100px;
                padding: 0 15px;
            }
            
            .color-code {
                font-size: 14px;
            }
            
            .color-name {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <div class="nav-item active" onclick="switchTab('generate')">Generate Palette</div>
            <div class="nav-item" onclick="switchTab('image')">Palette from Image</div>
        </div>

        <div id="generateTab" class="tab-content active">
            <h1>Ohuhu Palette Generator</h1>
            <p class="subtitle">216 Honolulu B colors</p>
            
            <div class="controls">
                <div class="control-group">
                    <label for="paletteSize">Palette Size</label>
                    <select id="paletteSize">
                        <option value="4">4 colors</option>
                        <option value="5" selected>5 colors</option>
                        <option value="6">6 colors</option>
                        <option value="7">7 colors</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label for="colorStyle">Color Style</label>
                    <select id="colorStyle">
                        <option value="all" selected>All colors</option>
                        <option value="warm">Warm colors</option>
                        <option value="cool">Cool colors</option>
                        <option value="pastel">Pastels</option>
                        <option value="bright">Bright/Vibrant</option>
                        <option value="earth">Earth tones</option>
                        <option value="neutral">Neutrals</option>
                    </select>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-generate" onclick="generatePalette()">
                        <span>🎲</span> Generate
                    </button>
                    <button class="btn btn-save" onclick="savePalette()">
                        <span>💾</span> Save
                    </button>
                </div>
            </div>

            <div class="palette-display">
                <div class="palette" id="palette"></div>
                <div id="colorNames" style="display: flex; gap: 15px;"></div>
            </div>

            <div class="instructions">
                <span>🔒 Click on lock icons to lock/unlock colors before generating</span>
                <span>•</span>
                <span>✨ Press 'Space' to randomize</span>
            </div>
        </div>

        <div id="imageTab" class="tab-content">
            <h1>Palette from Image</h1>
            <p class="subtitle">Extract Ohuhu colors from any image</p>
            
            <div class="upload-area" onclick="document.getElementById('imageInput').click()" 
                 ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                <div class="upload-icon">🖼️</div>
                <div class="upload-text">Click to upload or drag & drop</div>
                <div class="upload-subtext">PNG, JPG, WEBP up to 10MB</div>
            </div>
            <input type="file" id="imageInput" accept="image/*" onchange="handleImageUpload(event)">
            
            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" class="image-preview" alt="Preview">
                
                <div class="controls">
                    <div class="control-group">
                        <label for="imagePaletteSize">Palette Size</label>
                        <select id="imagePaletteSize">
                            <option value="4">4 colors</option>
                            <option value="5" selected>5 colors</option>
                            <option value="6">6 colors</option>
                            <option value="7">7 colors</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-generate" onclick="extractPaletteFromImage()">
                        <span>🎨</span> Extract Palette
                    </button>
                </div>
                
                <div class="palette-display">
                    <div class="palette" id="imagePalette"></div>
                    <div id="imageColorNames" style="display: flex; gap: 15px;"></div>
                </div>
            </div>
        </div>
    </div>

            { code: "YR43", name: "Pale Cherry Pink", hex: "#fcdbcf" },
            { code: "YR513", name: "Papaya", hex: "#f47c60" },
            { code: "YR515", name: "Burnt Sienna", hex: "#c97765" },
            { code: "YR52", name: "Cameo Rose", hex: "#fae0d7" },
            { code: "YR55", name: "Pink Lemonade", hex: "#f2c5bb" },
            { code: "YR59", name: "Cantaloupe", hex: "#f9af9c" },
        ];

        let currentPalette = [];
        let lockedColors = new Set();
        let currentTab = 'generate';
        let uploadedImage = null;

        // Color categorization
        const colorCategories = {
            warm: ['R', 'YR', 'Y', 'E'],
            cool: ['B', 'BG', 'G', 'V'],
            pastel: ['000', '00', '01', '02', '10', '11', '12', '20', '21'],
            bright: ['04', '05', '06', '07', '08', '09', '14', '15', '16', '17', '18', '19'],
            earth: ['E', 'YR2', 'YR3', 'Y2', 'W', 'C'],
            neutral: ['W', 'C', '100', '110', '0']
        };

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'generate') {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
                document.getElementById('generateTab').classList.add('active');
            } else {
                document.querySelectorAll('.nav-item')[1].classList.add('active');
                document.getElementById('imageTab').classList.add('active');
            }
        }

        function getFilteredColors(style) {
            if (style === 'all') return ohuhuColors;
            
            const category = colorCategories[style];
            return ohuhuColors.filter(color => {
                const code = color.code;
                
                // Exclude purely numeric codes (100, 110, 0) from pastel filter
                if (style === 'pastel' && /^\d+$/.test(code)) {
                    return false;
                }
                
                return category.some(pattern => {
                    // For pastel/bright patterns (numeric suffixes), check if code ENDS with pattern
                    if (style === 'pastel' || style === 'bright') {
                        return code.endsWith(pattern);
                    }
                    // For other categories, check if code starts with or includes pattern
                    if (pattern.length <= 2) {
                        return code.startsWith(pattern);
                    } else {
                        return code.includes(pattern);
                    }
                });
            });
        }

        function generatePalette() {
            const paletteSize = parseInt(document.getElementById('paletteSize').value);
            const colorStyle = document.getElementById('colorStyle').value;
            const availableColors = getFilteredColors(colorStyle);
            
            const newPalette = [];
            
            for (let i = 0; i < paletteSize; i++) {
                if (i < currentPalette.length && lockedColors.has(i)) {
                    newPalette.push(currentPalette[i]);
                } else {
                    const randomColor = availableColors[Math.floor(Math.random() * availableColors.length)];
                    newPalette.push(randomColor);
                }
            }
            
            currentPalette = newPalette;
            renderPalette();
        }

        function renderPalette() {
            const palette = document.getElementById('palette');
            palette.innerHTML = '';
            
            currentPalette.forEach((color, index) => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = color.hex;
                swatch.draggable = true;
                swatch.dataset.index = index;
                
                swatch.innerHTML = `
                    <div class="color-info">
                        <div class="color-code">${color.code}</div>
                        <div class="color-name">${color.name}</div>
                    </div>
                    <button class="lock-btn ${lockedColors.has(index) ? 'locked' : ''}" onclick="toggleLock(${index}, event)">
                        <svg viewBox="0 0 24 24">
                            ${lockedColors.has(index) 
                                ? '<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>'
                                : '<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h2c0-1.66 1.34-3 3-3s3 1.34 3 3v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm0 12H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/>'
                            }
                        </svg>
                    </button>
                `;
                
                swatch.addEventListener('dragstart', handleDragStart);
                swatch.addEventListener('dragover', handleDragOver);
                swatch.addEventListener('drop', handleDrop);
                swatch.addEventListener('dragend', handleDragEnd);
                
                palette.appendChild(swatch);
            });
        }

        function toggleLock(index, event) {
            event.stopPropagation();
            if (lockedColors.has(index)) {
                lockedColors.delete(index);
            } else {
                lockedColors.add(index);
            }
            renderPalette();
        }

        let draggedIndex = null;

        function handleDragStart(e) {
            draggedIndex = parseInt(e.currentTarget.dataset.index);
            e.currentTarget.classList.add('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e) {
            e.preventDefault();
            const dropIndex = parseInt(e.currentTarget.dataset.index);
            
            if (draggedIndex !== dropIndex) {
                const temp = currentPalette[draggedIndex];
                currentPalette[draggedIndex] = currentPalette[dropIndex];
                currentPalette[dropIndex] = temp;
                
                const wasSourceLocked = lockedColors.has(draggedIndex);
                const wasTargetLocked = lockedColors.has(dropIndex);
                
                lockedColors.delete(draggedIndex);
                lockedColors.delete(dropIndex);
                
                if (wasSourceLocked) lockedColors.add(dropIndex);
                if (wasTargetLocked) lockedColors.add(draggedIndex);
                
                renderPalette();
            }
        }

        function handleDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            draggedIndex = null;
        }

        function savePalette() {
            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');
            
            const swatchWidth = canvas.width / currentPalette.length;
            
            currentPalette.forEach((color, index) => {
                ctx.fillStyle = color.hex;
                ctx.fillRect(index * swatchWidth, 0, swatchWidth, canvas.height);
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 24px Arial';
                ctx.fillText(color.code, index * swatchWidth + 20, 40);
            });
            
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ohuhu-palette.png';
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        // Image upload functions
        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('dragover');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                loadImage(file);
            }
        }

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImage = e.target.result;
                document.getElementById('imagePreview').src = uploadedImage;
                document.getElementById('previewContainer').classList.add('active');
            };
            reader.readAsDataURL(file);
        }

        function extractPaletteFromImage() {
            if (!uploadedImage) return;
            
            const img = document.getElementById('imagePreview');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const colors = [];
            
            // Sample colors from the image
            for (let i = 0; i < imageData.length; i += 4 * 100) {
                const r = imageData[i];
                const g = imageData[i + 1];
                const b = imageData[i + 2];
                colors.push({ r, g, b });
            }
            
            // K-means clustering to find dominant colors
            const paletteSize = parseInt(document.getElementById('imagePaletteSize').value);
            const dominantColors = kMeansClustering(colors, paletteSize);
            
            // Find closest Ohuhu colors
            const imagePalette = dominantColors.map(color => {
                return findClosestOhuhuColor(color.r, color.g, color.b);
            });
            
            renderImagePalette(imagePalette);
        }

        function kMeansClustering(colors, k) {
            // Simple k-means implementation
            let centroids = colors.slice(0, k);
            
            for (let iteration = 0; iteration < 10; iteration++) {
                const clusters = Array.from({ length: k }, () => []);
                
                colors.forEach(color => {
                    let minDist = Infinity;
                    let closest = 0;
                    
                    centroids.forEach((centroid, i) => {
                        const dist = Math.sqrt(
                            Math.pow(color.r - centroid.r, 2) +
                            Math.pow(color.g - centroid.g, 2) +
                            Math.pow(color.b - centroid.b, 2)
                        );
                        if (dist < minDist) {
                            minDist = dist;
                            closest = i;
                        }
                    });
                    
                    clusters[closest].push(color);
                });
                
                centroids = clusters.map(cluster => {
                    if (cluster.length === 0) return centroids[0];
                    const avg = {
                        r: cluster.reduce((sum, c) => sum + c.r, 0) / cluster.length,
                        g: cluster.reduce((sum, c) => sum + c.g, 0) / cluster.length,
                        b: cluster.reduce((sum, c) => sum + c.b, 0) / cluster.length
                    };
                    return avg;
                });
            }
            
            return centroids;
        }

        function findClosestOhuhuColor(r, g, b) {
            let minDist = Infinity;
            let closest = ohuhuColors[0];
            
            ohuhuColors.forEach(color => {
                const hex = color.hex;
                const cr = parseInt(hex.slice(1, 3), 16);
                const cg = parseInt(hex.slice(3, 5), 16);
                const cb = parseInt(hex.slice(5, 7), 16);
                
                const dist = Math.sqrt(
                    Math.pow(r - cr, 2) +
                    Math.pow(g - cg, 2) +
                    Math.pow(b - cb, 2)
                );
                
                if (dist < minDist) {
                    minDist = dist;
                    closest = color;
                }
            });
            
            return closest;
        }

        function renderImagePalette(palette) {
            const container = document.getElementById('imagePalette');
            container.innerHTML = '';
            
            palette.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.backgroundColor = color.hex;
                swatch.innerHTML = `
                    <div class="color-info">
                        <div class="color-code">${color.code}</div>
                        <div class="color-name">${color.name}</div>
                    </div>
                `;
                container.appendChild(swatch);
            });
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
                e.preventDefault();
                if (currentTab === 'generate') {
                    generatePalette();
                }
            }
        });

        // Handle palette size changes
        document.getElementById('paletteSize').addEventListener('change', () => {
            const newSize = parseInt(document.getElementById('paletteSize').value);
            const currentSize = currentPalette.length;
            
            if (newSize > currentSize) {
                const colorStyle = document.getElementById('colorStyle').value;
                const availableColors = getFilteredColors(colorStyle);
                for (let i = currentSize; i < newSize; i++) {
                    const randomColor = availableColors[Math.floor(Math.random() * availableColors.length)];
                    currentPalette.push(randomColor);
                }
            } else if (newSize < currentSize) {
                currentPalette = currentPalette.slice(0, newSize);
                lockedColors = new Set([...lockedColors].filter(i => i < newSize));
            }
            
            renderPalette();
        });

        // Initialize
        generatePalette();
    </script>
